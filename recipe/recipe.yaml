schema_version: 1

context:
  name: fontpens
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 037d32fc4209e434076c7b3257c790a8e106f388b3ff22ffcf608e28bcc18536

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >=${{ python_min }}
    - fonttools >=4.40

tests:
  - python:
      imports:
        - fontPens
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A collection of classes implementing the pen protocol for manipulating glyphs.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/robofab-developers/fontPens

extra:
  recipe-maintainers:
    - thewchan
